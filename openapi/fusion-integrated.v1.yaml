  securitySchemes:
    iamSession:
      type: apiKey
      in: header
      name: Authorization
      description: '`Token <value>` from the IAM, or the httpOnly `auth_token` cookie
        the SPA carries.'
    recruiterSession:
      type: apiKey
      in: header
      name: Authorization
      description: '`Recruiter <value>` for an external company account, or the httpOnly
