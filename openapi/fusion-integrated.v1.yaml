          type: string
          maxLength: 9
        label:
          type: string
          maxLength: 120
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - academic_year
      - created_at
      - end_date
      - id
      - label
      - start_date
      - updated_at
    WaiveIncident:
      type: object
