          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        designation:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 32
        is_primary:
          type: boolean
      required:
      - email
      - id
      - name
    CompanyStatusEnum:
      enum:
      - prospect
      - active
      - blacklisted
