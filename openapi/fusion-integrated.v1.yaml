        * `prospect` - Prospect
        * `active` - Active
        * `blacklisted` - Blacklisted
    ConductIncident:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/ConductIncidentKindEnum'
          readOnly: true
        posting:
          type: integer
          readOnly: true
          nullable: true
        note:
          type: string
          readOnly: true
        waived:
          type: boolean
          readOnly: true
        waived_reason:
          type: string
          readOnly: true
        recorded_by_user_id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - kind
      - note
      - posting
      - recorded_by_user_id
      - user_id
      - waived
      - waived_reason
    ConductIncidentKindEnum:
      enum:
      - consent_failure
      - code_of_conduct
