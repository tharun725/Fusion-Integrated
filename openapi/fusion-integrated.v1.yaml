      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicDirectory'
          description: ''
  /api/v1/placement/students/cpi/filters:
    get:
      operationId: v1_placement_students_cpi_filters_retrieve
      description: The values actually present, so the UI hard-codes nothing.
      tags:
      - v1
      security:
      - iamSession: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicFilters'
          description: ''
components:
  schemas:
    AcademicDirectory:
      type: object
      properties:
        count:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/AcademicStandingRow'
      required:
      - count
      - limit
      - offset
      - results
    AcademicFilters:
      type: object
      properties:
        disciplines:
          type: array
          items:
            type: string
        batch_years:
          type: array
          items:
            type: integer
        programmes:
          type: array
          items:
            type: string
      required:
      - batch_years
      - disciplines
      - programmes
    AcademicStandingRow:
      type: object
      description: |-
        One row of the CPI directory. `cpi` is null when nothing is declared —
        never zero.
      properties:
        user_id:
          type: integer
        roll_no:
          type: string
        name:
          type: string
        programme:
          type: string
        discipline:
          type: string
        batch_year:
          type: integer
          nullable: true
        cpi:
          type: string
          nullable: true
        semester:
          type: integer
          nullable: true
        semester_type:
          type: string
          nullable: true
        declared_seq:
          type: integer
          nullable: true
        earned_credits:
          type: string
          nullable: true
        active_backlogs:
          type: integer
          nullable: true
      required:
      - active_backlogs
      - batch_year
      - cpi
      - declared_seq
      - discipline
      - earned_credits
      - name
      - programme
      - roll_no
      - semester
      - semester_type
      - user_id
    AddCandidates:
      type: object
      properties:
        application_ids:
          type: array
          items:
            type: integer
          maxItems: 500
          minItems: 1
      required:
      - application_ids
    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        body:
          type: string
          readOnly: true
        topic:
          allOf:
          - $ref: '#/components/schemas/TopicEnum'
          readOnly: true
        audience:
          allOf:
          - $ref: '#/components/schemas/AudienceEnum'
          readOnly: true
        placement_year:
          type: string
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        published_by_role:
          type: string
          readOnly: true
        is_withdrawn:
          type: boolean
          readOnly: true
        withdrawn_reason:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - audience
      - body
      - created_at
      - id
      - is_withdrawn
      - placement_year
      - published_at
      - published_by_role
      - title
      - topic
      - withdrawn_reason
    ApplicantKindEnum:
      enum:
      - faculty
      - staff
      type: string
      description: |-
        * `faculty` - Faculty
        * `staff` - Staff
    Application:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        posting:
          allOf:
          - $ref: '#/components/schemas/JobPosting'
          readOnly: true
        user_id:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        cpi_at_apply:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        semester_at_apply:
          type: integer
          readOnly: true
          nullable: true
        eligibility_snapshot:
          readOnly: true
        cover_note:
          type: string
          readOnly: true
        applied_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        withdrawn_reason:
          type: string
          readOnly: true
        allowed_transitions:
          type: array
          items:
            type: string
          readOnly: true
        candidate:
          type: object
          additionalProperties: {}
          nullable: true
          description: |-
            Populated only when the view batch-loaded the directory, i.e. when
            the reader is staff. A student's own list needs no directory call.
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - allowed_transitions
      - applied_at
      - candidate
      - cover_note
      - cpi_at_apply
      - created_at
      - eligibility_snapshot
      - id
      - posting
      - semester_at_apply
      - status
      - user_id
      - withdrawn_reason
    ApplicationStatusEnum:
      enum:
      - draft
      - submitted
      - under_review
      - shortlisted
      - interview_scheduled
      - selected
      - rejected
      - withdrawn
      - auto_withdrawn
      - offer_issued
      - offer_accepted
      - offer_declined
      - offer_expired
      type: string
      description: |-
        * `draft` - Draft
        * `submitted` - Submitted
        * `under_review` - Under review
        * `shortlisted` - Shortlisted
        * `interview_scheduled` - Interview scheduled
        * `selected` - Selected
        * `rejected` - Rejected
        * `withdrawn` - Withdrawn
        * `auto_withdrawn` - Withdrawn automatically
        * `offer_issued` - Offer issued
        * `offer_accepted` - Offer accepted
        * `offer_declined` - Offer declined
        * `offer_expired` - Offer expired
    Apply:
      type: object
      properties:
        posting_id:
          type: integer
        cover_note:
          type: string
          default: ''
          maxLength: 4000
        resume_id:
          type: integer
          nullable: true
      required:
      - posting_id
    ApplySanction:
      type: object
      properties:
        season:
          type: string
          maxLength: 12
        user_id:
          type: integer
        sanction:
          $ref: '#/components/schemas/SanctionEnum'
        rule:
          type: string
          maxLength: 4
        reason:
          type: string
          maxLength: 300
      required:
      - reason
      - rule
      - sanction
      - season
      - user_id
    Approval:
      type: object
      properties:
        note:
          type: string
          default: ''
          maxLength: 300
    ApprovalStatusEnum:
      enum:
      - pending
      - approved
      - rejected
      type: string
      description: |-
        * `pending` - Pending institute approval
        * `approved` - Approved
        * `rejected` - Rejected
    AudienceEnum:
      enum:
      - students
      - registered
      - alumni
      - all
      type: string
      description: |-
        * `students` - All students
        * `registered` - Registered students
        * `alumni` - Alumni
        * `all` - Everyone
    BlankEnum:
      enum:
      - ''
    BulkOutcome:
      type: object
      properties:
        application_id:
          type: integer
        moved:
          type: boolean
        error:
          type: string
        code:
          type: string
      required:
      - application_id
      - code
      - error
      - moved
    BulkResult:
      type: object
      description: |-
        Counts first, then the per-item detail — a partial run must never read
        as a complete one.
      properties:
        moved:
          type: integer
        refused:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/BulkOutcome'
      required:
      - moved
      - refused
      - results
    BulkTransition:
      type: object
      properties:
        application_ids:
          type: array
          items:
            type: integer
          maxItems: 200
        to_status:
          type: string
          maxLength: 24
        reason:
          type: string
          default: ''
          maxLength: 300
      required:
      - application_ids
      - to_status
    Candidate:
      type: object
      description: A person as the ERP portal and the IAM describe them. Read-only
        here.
      properties:
        user_id:
          type: integer
        name:
          type: string
        roll_no:
          type: string
        email:
          type: string
        programme:
          type: string
        discipline:
          type: string
        batch_year:
          type: integer
          nullable: true
        resume_link:
          type: string
        profile_completed:
          type: boolean
        academic:
          nullable: true
      required:
      - academic
      - batch_year
      - discipline
      - email
      - name
      - profile_completed
      - programme
      - resume_link
      - roll_no
      - user_id
    CategoryEnum:
      enum:
      - CL
      - RH
      - SCL
      - EL
      - COL
      - VL
      type: string
      description: |-
        * `CL` - CL
        * `RH` - RH
        * `SCL` - SCL
        * `EL` - EL
        * `COL` - COL
        * `VL` - VL
    Clearance:
      type: object
      description: Rule 24. `blocking` names each company, so a refusal is actionable.
      properties:
        user_id:
          type: integer
        cleared:
          type: boolean
        blocking:
          type: array
          items:
            type: string
        message:
          type: string
      required:
      - blocking
      - cleared
      - message
      - user_id
    Company:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        sector:
          type: string
          readOnly: true
        sector_kind:
          allOf:
          - $ref: '#/components/schemas/SectorKindEnum'
          readOnly: true
        website:
          type: string
          format: uri
          readOnly: true
        hq_city:
          type: string
          readOnly: true
        tier_rank:
          type: integer
          readOnly: true
          nullable: true
          description: 1 = best
        is_marquee:
          type: boolean
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/CompanyStatusEnum'
          readOnly: true
        approval_status:
          allOf:
          - $ref: '#/components/schemas/ApprovalStatusEnum'
          readOnly: true
        approval_note:
          type: string
          readOnly: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        can_operate:
          type: boolean
          readOnly: true
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/CompanyContact'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approval_note
      - approval_status
      - approved_at
      - can_operate
      - contacts
      - created_at
      - hq_city
      - id
      - is_marquee
      - name
      - sector
      - sector_kind
      - slug
      - status
      - tier_rank
      - website
    CompanyBrief:
      type: object
      description: What a student sees. No approval trail, no internal notes.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        sector:
          type: string
          readOnly: true
        sector_kind:
          allOf:
          - $ref: '#/components/schemas/SectorKindEnum'
          readOnly: true
        website:
          type: string
          format: uri
          readOnly: true
        hq_city:
          type: string
          readOnly: true
        tier_rank:
          type: integer
          readOnly: true
          nullable: true
          description: 1 = best
        is_marquee:
          type: boolean
          readOnly: true
      required:
      - hq_city
      - id
      - is_marquee
      - name
      - sector
      - sector_kind
      - slug
      - tier_rank
      - website
    CompanyContact:
      type: object
      properties:
